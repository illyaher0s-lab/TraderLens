# Strategy 005: Conservative High Bar Entry (Low Trade Count Case)
#
# Hypothesis: Very strict entry criteria to test low trade count handling
# Exit: MA cross below
#
# Data source: mock (for toolchain validation only)
# Result usage: toolchain_validation_only
# Expected: Very few or zero trades to test Prototype Gate min_trade_count

strategy_name: strategy_005_low_trade_count_negative
version: v1
status: draft

hypothesis_source_snapshot:
  source_type: manual
  source_run_id: sprint_validation_005_negative
  evidence_pack_ids: []
  generated_at: "2026-06-22T00:00:00"
  data_range_used_for_generation:
    start: "2023-01-01"
    end: "2024-12-31"

universe:
  type: static_list
  symbols:
    - "000001.SZ"
    - "600519.SH"

entry_conditions:
  logic: AND
  rules:
    # Very strict: both price AND volume must surge
    - type: breakthrough
      field: close
      benchmark: high_30d  # 30-day high (rare)
      operator: ">="
    - type: volume_surge
      field: volume
      benchmark: ma_volume_20d
      multiplier: 3.0  # 3x volume (very rare)
      operator: ">="

exit_conditions:
  logic: OR
  rules:
    - type: ma_condition
      field: close
      ma_period: 5
      operator: "<"

risk_filters:
  max_position_per_stock: 0.40
  max_total_position: 0.80
  restrict_limit_up_buy: true
  restrict_limit_down_sell: true
  restrict_suspended: true
  min_liquidity_for_trade: 20000000  # High liquidity requirement

rebalance:
  frequency: daily
  check_time: close

fill_model:
  signal_to_execution: T+1
  execution_price: open
  commission: 0.0003
  stamp_tax: 0.001
  slippage: 0.0
  lot_size: 100
  lot_rounding: floor
  handling:
    limit_up_buy: skip
    limit_down_sell: defer_next_day
    suspended: skip

backtest_config:
  initial_capital: 100000.0
  start_date: "2023-01-03"
  end_date: "2024-12-31"
  sample_split:
    in_sample_end: "2023-12-31"
    out_of_sample_start: "2024-01-01"
  benchmark:
    type: index
    code: "000300.SH"
    name: "CSI 300"
  data_source: fixed_fixture
  include_delisted: partial

prototype_gate:
  enabled: true
  min_trades: 5  # Likely to fail this (too few trades)
  # max_trade_density (removed): 0.5
  min_closed_lot_win_rate: 0.3
  # max_single_loss (removed): 0.15

