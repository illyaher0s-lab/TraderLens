# Strategy: Real Data Backtest - M3.4
#
# Hypothesis: Breakout momentum with volume confirmation
# Data source: Tushare frozen snapshot (10 stocks, Dec 2023)
# Purpose: Validate TushareDataSource integration with strategy_core
#
# Entry: Price breakthrough + volume surge
# Exit: MA crossover or stop loss
#

strategy_name: tushare_real_data_m3_4
version: v1
status: draft

hypothesis_source_snapshot:
  source_type: manual
  source_run_id: m3_4_real_data_integration
  evidence_pack_ids: []
  generated_at: "2026-06-22T00:00:00"
  data_range_used_for_generation:
    start: "2023-12-01"
    end: "2023-12-31"

universe:
  type: static_list
  symbols:
    - "600519.SH"  # 贵州茅台
    - "000001.SZ"  # 平安银行
    - "600036.SH"  # 招商银行
    - "000858.SZ"  # 五粮液
    - "600276.SH"  # 恒瑞医药
    - "000333.SZ"  # 美的集团
    - "601318.SH"  # 中国平安
    - "600309.SH"  # 万华化学
    - "300750.SZ"  # 宁德时代
    - "002475.SZ"  # 立讯精密

entry_conditions:
  logic: AND
  rules:
    - type: breakthrough
      field: close
      benchmark: high_5d
      operator: ">="
    - type: volume_surge
      threshold: 1.5
      period: 5

exit_conditions:
  logic: OR
  rules:
    - type: ma_condition
      field: close
      ma_period: 10
      operator: "<"
    - type: stop_loss_pct
      threshold: 0.05

risk_filters:
  max_position_per_stock: 0.20
  max_total_position: 0.80
  restrict_limit_up_buy: true
  restrict_limit_down_sell: true
  restrict_suspended: true
  min_liquidity_for_trade: 10000000

rebalance:
  frequency: daily
  check_time: close

fill_model:
  signal_to_execution: T+1
  execution_price: open
  commission: 0.0003
  stamp_tax: 0.001
  slippage: 0.0
  lot_size: 100
  lot_rounding: floor
  handling:
    limit_up_buy: skip
    limit_down_sell: defer_next_day
    suspended: skip

backtest_config:
  initial_capital: 100000.0
  start_date: "2023-12-01"
  end_date: "2023-12-29"
  sample_split:
    in_sample_end: "2023-12-15"
    out_of_sample_start: "2023-12-16"
  benchmark:
    type: index
    code: "000300.SH"
    name: "CSI 300"
  data_source: tushare
  include_delisted: partial

prototype_gate:
  enabled: true
  min_trades: 1
  min_closed_lot_win_rate: 0.0

audit:
  created_at: "2026-06-22T00:00:00"
  created_by: "m3_4_validation"
  last_modified_at: "2026-06-22T00:00:00"
  config_hash: "m3_4_real_data_v1"
